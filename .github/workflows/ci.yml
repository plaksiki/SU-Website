name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: su-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: su-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: QR-1 No suppressed warnings
        run: |
          if grep -rn "eslint-disable\|@ts-ignore\|as any" src/ --include="*.ts" --include="*.tsx"; then
            echo "❌ Suppressed warnings found. Remove eslint-disable / @ts-ignore / 'as any' and fix the underlying issue."
            exit 1
          fi
          echo "✅ No suppressed warnings found"

      - name: Run tests
        run: npm run test

      - name: Type check & Build
        run: npm run build

      - name: Check bundle size (max 1 MB)
        run: |
          size=$(find dist/assets -name "*.js" | xargs wc -c 2>/dev/null | tail -1 | awk '{print $1}')
          echo "Bundle size: $size bytes"
          if [ "$size" -gt 1048576 ]; then
            echo "❌ Bundle size exceeds 1 MB limit ($size bytes)"
            exit 1
          fi
          echo "✅ Bundle size is within 1 MB limit"

  healthcheck:
    name: QR-2 Healthcheck
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start preview server
        working-directory: su-frontend
        run: |
          npm ci
          npm run build
          npx vite preview --port 5173 &
          sleep 3

      - name: Run healthcheck
        run: |
          chmod +x healthcheck.sh
          BASE_URL=http://localhost:5173 bash healthcheck.sh

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: su-backend/backend/demo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build
        run: ./mvnw clean compile -DskipTests
