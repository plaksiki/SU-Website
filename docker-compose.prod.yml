services:
  backend:
    image: su-backend
    build: 
      context: ./su-backend
    depends_on:
        db: 
          condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      # SPRING_REDIS_HOST: redis
      # SPRING_REDIS_PORT: 6379
    restart: unless-stopped
    ports:
      - "8080:8080"
  frontend:
    image: su-frontend
    build:
      context: ./su-frontend
    ports:
      - "80:80"
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 8080
    depends_on:
      - backend
    restart: unless-stopped
        
  db:
    image: postgres:16.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./su-backend/migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped
  
volumes:
  db_data:
